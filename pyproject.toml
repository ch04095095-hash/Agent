[project]
name = "agent-workspace"
version = "0.1.0"
description = "Unified Python environment for Agent workspace"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.12",
  "faiss-cpu>=1.8.0",
  "sentence-transformers>=3.0.0",
  "rank-bm25>=0.2.2",
  "numpy>=1.24.0",
  "pypdf>=4.2.0",
  "pdfplumber>=0.11.0",
  "openpyxl>=3.1.0",
  "python-docx>=1.1.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
